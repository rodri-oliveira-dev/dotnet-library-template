version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    groups:
      nuget-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
      nuget-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 2
    # Keep this .NET 10 template on its current SDK channel until migration is coordinated.
    # Patch updates remain eligible for Dependabot and the SDK sync workflow.
    ignore:
      - dependency-name: "dotnet-sdk"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      dotnet-sdk-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    groups:
      github-actions-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
      github-actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"
