name: CodeQL

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '23 8 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analisar C# com CodeQL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - name: Restaurar dependências em locked mode
        run: dotnet restore Template.Library.slnx --locked-mode

      - name: Compilar para análise
        run: dotnet build Template.Library.slnx --configuration Release --no-restore

      - name: Executar análise CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:csharp'
