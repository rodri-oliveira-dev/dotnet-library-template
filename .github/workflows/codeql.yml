name: CodeQL

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '23 8 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analisar C# com CodeQL
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validar SHA consistente das ações CodeQL
        shell: bash
        run: |
          file=".github/workflows/codeql.yml"
          pinned_count=$(grep -Ec '^[[:space:]]*uses: github/codeql-action/(init|analyze)@[0-9a-f]{40}([[:space:]]|$)' "$file")
          distinct_sha_count=$(grep -Eo 'github/codeql-action/(init|analyze)@[0-9a-f]{40}' "$file" | cut -d@ -f2 | sort -u | wc -l)
          if [ "$pinned_count" -ne 2 ] || [ "$distinct_sha_count" -ne 1 ]; then
            echo "::error::CodeQL init/analyze must both be pinned to the same full commit SHA."
            exit 1
          fi

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@ce8b5602e2e75eddc698f13db2342ef698999255 # v4
        with:
          languages: csharp
          build-mode: manual

      - name: Restaurar dependências em locked mode
        run: dotnet restore Template.Library.slnx --locked-mode

      - name: Compilar para análise
        run: dotnet build Template.Library.slnx --configuration Release --no-restore

      - name: Executar análise CodeQL
        uses: github/codeql-action/analyze@ce8b5602e2e75eddc698f13db2342ef698999255 # v4
        with:
          category: '/language:csharp'
