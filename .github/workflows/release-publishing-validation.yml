name: Release publishing validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-publishing-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  publication-gate:
    name: Validate release and NuGet publication flow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Validate release workflow contract
        shell: bash
        run: |
          set -euo pipefail

          release='.github/workflows/release.yml'
          request_resolver='scripts/resolve-release-request.sh'
          nuget_resolver='scripts/resolve-nuget-publishing.sh'
          candidate_helper='scripts/release-candidate.cs'
          template_package='packaging/RodriOliveira.DotNet.Library.Template.csproj'
          template_verifier='scripts/verify-template-package.cs'
          template_e2e='scripts/validate-template-package-e2e.sh'

          test -s "$release"
          test -s "$request_resolver"
          test -s "$nuget_resolver"
          test -s "$candidate_helper"
          test -s "$template_package"
          test -s "$template_verifier"
          test -s "$template_e2e"
          test ! -e scripts/ensure-release-tag.sh

          grep -Fq 'run-name:' "$release"
          grep -Fq 'pull_request:' "$release"
          grep -Fq 'workflow_dispatch:' "$release"
          grep -Fq 'publish:' "$release"
          grep -Fq 'type: boolean' "$release"
          grep -Fq 'default: false' "$release"
          grep -Fq 'DOTNET_CLI_TELEMETRY_OPTOUT: "1"' "$release"
          grep -Fq 'DOTNET_NOLOGO: "1"' "$release"
          grep -Fq 'global-json-file: global.json' "$release"
          grep -Fq 'persist-credentials: false' "$release"
          grep -Fq 'name: Build release candidate' "$release"
          grep -Fq 'version: "${{ steps.release-metadata.outputs.version }}"' "$release"
          grep -Fq 'tag: "${{ steps.release-metadata.outputs.tag }}"' "$release"
          grep -Fq 'is-prerelease: "${{ steps.release-metadata.outputs.is_prerelease }}"' "$release"
          grep -Fq 'run: bash scripts/resolve-release-request.sh' "$release"
          grep -Fq 'dotnet format Template.Library.slnx --verify-no-changes --no-restore' "$release"
          grep -Fq 'Validate placeholder library publication guard' "$release"
          grep -Fq 'safe_to_publish=false' "$release"
          grep -Fq 'Pack placeholder library for validation only' "$release"
          grep -Fq 'artifacts/validation-packages' "$release"
          grep -Fq 'Pack template package' "$release"
          grep -Fq 'packaging/RodriOliveira.DotNet.Library.Template.csproj' "$release"
          grep -Fq 'RodriOliveira.DotNet.Library.Template.${RELEASE_VERSION}.nupkg' "$release"
          grep -Fq 'Validate template package install and parity' "$release"
          grep -Fq 'Generate release manifest and checksums' "$release"
          grep -Fq 'release-candidate-${{ steps.release-metadata.outputs.version }}' "$release"
          grep -Fq 'Verify downloaded release candidate' "$release"
          grep -Fq 'actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2' "$release"
          grep -Fq 'Create or resume draft GitHub Release' "$release"
          grep -Fq 'NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0' "$release"
          grep -Fq 'Publish template package to NuGet.org' "$release"
          grep -Fq 'Publish GitHub Release' "$release"
          grep -Fq 'environment: release' "$release"
          grep -Fq 'refs/heads/main' "$release"
          grep -Fq 'commit: "${{ steps.release-commit.outputs.commit }}"' "$release"
          grep -Fq 'VALIDATED_SHA: ${{ needs.build.outputs.commit }}' "$release"
          grep -Fq 'ref: "${{ needs.build.outputs.commit }}"' "$release"
          grep -Fq 'id-token: write' "$release"
          grep -Fq 'attestations: write' "$release"
          grep -Fq 'artifact-metadata: write' "$release"

          if grep -Fq 'push:' "$release"; then
            echo 'release.yml must not keep the old push-tag release trigger.'
            exit 1
          fi

          if grep -Eq 'secrets\.NUGET_API_KEY|write-all|packages:[[:space:]]write|artifacts/\*\*/\*.nupkg|major-alias|minor-alias|github packages|nuget.pkg.github.com' "$release"; then
            echo 'Persistent NuGet credentials, broad permissions, GitHub Packages, or Action aliases are not allowed.'
            exit 1
          fi

          id_token_jobs="$(awk '
            /^[[:space:]]{2}[A-Za-z0-9_-]+:$/ { job=$1; sub(":", "", job) }
            /id-token:[[:space:]]write/ { print job }
          ' "$release")"
          if [[ "$id_token_jobs" != 'publish' ]]; then
            echo "id-token: write must exist only on the publish job, got: $id_token_jobs"
            exit 1
          fi

          draft_line="$(grep -n 'Create or resume draft GitHub Release' "$release" | cut -d: -f1)"
          nuget_line="$(grep -n 'Publish template package to NuGet.org' "$release" | cut -d: -f1)"
          final_line="$(grep -n 'Publish GitHub Release' "$release" | tail -n 1 | cut -d: -f1)"
          if (( draft_line >= nuget_line || nuget_line >= final_line )); then
            echo 'Release must create/resume draft before NuGet and finalize only after NuGet succeeds.'
            exit 1
          fi

      - name: Validate release metadata resolver
        shell: bash
        run: |
          set -euo pipefail

          resolver='scripts/resolve-release-request.sh'

          assert_metadata() {
            expected_version="$1"
            expected_tag="$2"
            expected_prerelease="$3"
            expected_publish="$4"
            event_name="$5"
            requested_version="$6"
            publish_requested="$7"
            output="$(mktemp)"

            EVENT_NAME="$event_name" \
              REQUESTED_VERSION="$requested_version" \
              PUBLISH_REQUESTED="$publish_requested" \
              GITHUB_OUTPUT="$output" \
              bash "$resolver"

            grep -Fxq "version=$expected_version" "$output"
            grep -Fxq "tag=$expected_tag" "$output"
            grep -Fxq "is_prerelease=$expected_prerelease" "$output"
            grep -Fxq "should_publish=$expected_publish" "$output"
            rm -f "$output"
          }

          assert_metadata 0.0.0-ci.42 v0.0.0-ci.42 true false pull_request 0.0.0-ci.42 true
          assert_metadata 1.2.0 v1.2.0 false false workflow_dispatch 1.2.0 false
          assert_metadata 1.3.0-beta.1 v1.3.0-beta.1 true true workflow_dispatch 1.3.0-beta.1 true

          if EVENT_NAME=workflow_dispatch REQUESTED_VERSION=v1.2.0 PUBLISH_REQUESTED=true bash "$resolver"; then
            echo 'Versions with a leading v must be rejected.'
            exit 1
          fi

          if EVENT_NAME=workflow_dispatch REQUESTED_VERSION=1.2 PUBLISH_REQUESTED=true bash "$resolver"; then
            echo 'Invalid SemVer must be rejected.'
            exit 1
          fi

      - name: Validate NuGet publication decision matrix
        shell: bash
        run: |
          set -euo pipefail

          resolver='scripts/resolve-nuget-publishing.sh'

          assert_decision() {
            expected_enabled="$1"
            expected_reason="$2"
            should_publish="$3"
            safe_to_publish="$4"
            template_package_available="$5"
            user_mode="$6"
            user_value="${7:-}"
            output="$(mktemp)"

            if [[ "$user_mode" == 'absent' ]]; then
              env -u NUGET_USER \
                SHOULD_PUBLISH="$should_publish" \
                SAFE_TO_PUBLISH="$safe_to_publish" \
                TEMPLATE_PACKAGE_AVAILABLE="$template_package_available" \
                GITHUB_OUTPUT="$output" \
                bash "$resolver"
            else
              SHOULD_PUBLISH="$should_publish" \
                SAFE_TO_PUBLISH="$safe_to_publish" \
                TEMPLATE_PACKAGE_AVAILABLE="$template_package_available" \
                NUGET_USER="$user_value" \
                GITHUB_OUTPUT="$output" \
                bash "$resolver"
            fi

            grep -Fxq "nuget_publishing_enabled=$expected_enabled" "$output"
            grep -Fxq "nuget_publishing_reason=$expected_reason" "$output"
            rm -f "$output"
          }

          assert_decision false release-disabled false true true configured 'nuget-profile'
          assert_decision false nuget-user-not-configured true true false absent
          assert_decision false nuget-user-not-configured true true false configured ''
          assert_decision false nuget-user-not-configured true true false configured '   '
          assert_decision true enabled true true false configured 'nuget-profile'
          assert_decision false placeholder-package true false false configured 'nuget-profile'
          assert_decision true enabled true false true configured 'nuget-profile'
          assert_decision false nuget-user-not-configured true false true absent

      - name: Validate release candidate helper
        shell: bash
        run: |
          set -euo pipefail

          root="$(mktemp -d)"
          package="$root/Template.Library.1.2.0.nupkg"
          manifest="$root/release-manifest.json"
          checksums="$root/SHA256SUMS"

          printf 'validated package' > "$package"

          dotnet run --file scripts/release-candidate.cs -- manifest \
            --version 1.2.0 \
            --tag v1.2.0 \
            --commit 0000000000000000000000000000000000000000 \
            --package-id Template.Library \
            --package "$package" \
            --output "$manifest" \
            --checksums-output "$checksums"

          dotnet run --file scripts/release-candidate.cs -- verify \
            --version 1.2.0 \
            --tag v1.2.0 \
            --commit 0000000000000000000000000000000000000000 \
            --package-id Template.Library \
            --package "$package" \
            --manifest "$manifest" \
            --checksums "$checksums"

          printf 'tampered package' > "$package"

          if dotnet run --file scripts/release-candidate.cs -- verify \
            --version 1.2.0 \
            --tag v1.2.0 \
            --commit 0000000000000000000000000000000000000000 \
            --package-id Template.Library \
            --package "$package" \
            --manifest "$manifest" \
            --checksums "$checksums"; then
            echo 'Tampered release candidate must fail verification.'
            exit 1
          fi

      - name: Install template from checkout
        run: dotnet new install .

      - name: Generate validation library
        shell: bash
        run: |
          set -euo pipefail

          generated="$RUNNER_TEMP/release-publishing-template/Validation.SampleLibrary"
          mkdir -p "$(dirname "$generated")"
          dotnet new rodri-lib -n Validation.SampleLibrary -o "$generated"
          echo "GENERATED_ROOT=$generated" >> "$GITHUB_ENV"

      - name: Validate generated release flow
        shell: bash
        run: |
          set -euo pipefail

          release="$GENERATED_ROOT/.github/workflows/release.yml"
          request_resolver="$GENERATED_ROOT/scripts/resolve-release-request.sh"
          nuget_resolver="$GENERATED_ROOT/scripts/resolve-nuget-publishing.sh"
          candidate_helper="$GENERATED_ROOT/scripts/release-candidate.cs"

          test -s "$release"
          test -s "$request_resolver"
          test -s "$nuget_resolver"
          test -s "$candidate_helper"
          test ! -e "$GENERATED_ROOT/scripts/ensure-release-tag.sh"
          test ! -e "$GENERATED_ROOT/.github/workflows/release-publishing-validation.yml"
          test ! -e "$GENERATED_ROOT/packaging"
          test ! -e "$GENERATED_ROOT/.github/workflows/template-package-validation.yml"
          test ! -e "$GENERATED_ROOT/scripts/verify-template-package.cs"
          test ! -e "$GENERATED_ROOT/scripts/validate-template-package-e2e.sh"

          grep -Fq 'src/Validation.SampleLibrary/Validation.SampleLibrary.csproj' "$release"
          grep -Fq 'release-candidate-${{ steps.release-metadata.outputs.version }}' "$release"
          grep -Fq 'scripts/release-candidate.cs' "$release"
          grep -Fq 'release-manifest.json' "$release"
          grep -Fq 'SHA256SUMS' "$release"
          grep -Fq 'actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2' "$release"
          grep -Fq 'NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0' "$release"
          grep -Fq 'refs/heads/main' "$release"
          grep -Fq 'VALIDATED_SHA: ${{ needs.build.outputs.commit }}' "$release"
          grep -Fq 'ref: "${{ needs.build.outputs.commit }}"' "$release"
          grep -Fq 'Create or resume draft GitHub Release' "$release"
          grep -Fq 'Publish GitHub Release' "$release"
          grep -Fq 'NUGET_USER' "$GENERATED_ROOT/README.md"
          grep -Fq 'Settings' "$GENERATED_ROOT/README.md"
          grep -Fq 'Secrets and variables' "$GENERATED_ROOT/README.md"

          if grep -Eq 'RodriOliveira\.DotNet\.Library\.Template|packaging/|verify-template-package|validate-template-package-e2e|template-package-validation' "$release"; then
            echo 'Source-template release concerns leaked into generated release.yml.'
            exit 1
          fi

          if grep -Fq 'push:' "$release"; then
            echo 'Generated release.yml must not keep the old push-tag release trigger.'
            exit 1
          fi

          output="$(mktemp)"
          EVENT_NAME=workflow_dispatch \
            REQUESTED_VERSION=1.2.0 \
            PUBLISH_REQUESTED=false \
            GITHUB_OUTPUT="$output" \
            bash "$request_resolver"
          grep -Fxq 'version=1.2.0' "$output"
          grep -Fxq 'tag=v1.2.0' "$output"
          grep -Fxq 'should_publish=false' "$output"
          rm -f "$output"

          output="$(mktemp)"
          SHOULD_PUBLISH=true \
            SAFE_TO_PUBLISH=true \
            TEMPLATE_PACKAGE_AVAILABLE=false \
            NUGET_USER='' \
            GITHUB_OUTPUT="$output" \
            bash "$nuget_resolver"
          grep -Fxq 'nuget_publishing_enabled=false' "$output"
          grep -Fxq 'nuget_publishing_reason=nuget-user-not-configured' "$output"
          rm -f "$output"

      - name: Uninstall template
        if: always()
        run: dotnet new uninstall "$GITHUB_WORKSPACE" || true
