name: Release publishing validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-publishing-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication-gate:
    name: Validate protected release flow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Validate release workflow contract
        shell: bash
        run: |
          set -euo pipefail

          release='.github/workflows/release.yml'
          template_package='packaging/RodriOliveira.DotNet.Library.Template.csproj'
          template_verifier='scripts/verify-template-package.cs'
          template_e2e='scripts/validate-template-package-e2e.sh'

          test -s "$release"
          test -s "$template_package"
          test -s "$template_verifier"
          test -s "$template_e2e"

          grep -Fq 'run-name: "Release ${{ inputs.version || '''dry-run''' }} from ${{ github.ref_name }}"' "$release"
          grep -Fq 'pull_request:' "$release"
          grep -Fq 'workflow_dispatch:' "$release"
          grep -Fq 'publish:' "$release"
          grep -Fq 'default: false' "$release"
          grep -Fq 'type: boolean' "$release"
          grep -Fq 'permissions:' "$release"
          grep -Fq 'contents: read' "$release"
          grep -Fq 'DOTNET_CLI_TELEMETRY_OPTOUT:' "$release"
          grep -Fq 'DOTNET_NOLOGO:' "$release"

          grep -Fq 'build:' "$release"
          grep -Fq 'name: Build release artifacts' "$release"
          grep -Fq 'Resolve release metadata' "$release"
          grep -Fq "format('v0.0.0-ci.{0}', github.run_number)" "$release"
          grep -Fq 'Verify formatting' "$release"
          grep -Fq 'Build with analyzers' "$release"
          grep -Fq -- '--warnaserror' "$release"
          grep -Fq 'ContinuousIntegrationBuild=true' "$release"
          grep -Fq 'Assemble validated release candidate' "$release"
          grep -Fq 'release-manifest.json' "$release"
          grep -Fq 'SHA256SUMS' "$release"
          grep -Fq 'Upload validated release candidate' "$release"
          grep -Fq 'release-candidate-' "$release"

          grep -Fq 'placeholder_package_id="Template"".""Library"' "$release"
          grep -Fq 'safe_to_publish=false' "$release"
          grep -Fq 'Detect template package project' "$release"
          grep -Fq 'packaging/RodriOliveira.DotNet.Library.Template.csproj' "$release"
          grep -Fq 'RodriOliveira.DotNet.Library.Template' "$release"
          grep -Fq "package_type\" != 'Template'" "$release"
          grep -Fq 'Pack template package' "$release"
          grep -Fq 'scripts/verify-template-package.cs' "$release"
          grep -Fq 'scripts/validate-template-package-e2e.sh' "$release"

          grep -Fq 'publish:' "$release"
          grep -Fq 'name: Publish official release' "$release"
          grep -Fq "github.event_name == 'workflow_dispatch' && inputs.publish" "$release"
          grep -Fq 'environment: release' "$release"
          grep -Fq 'contents: write' "$release"
          grep -Fq 'id-token: write' "$release"
          grep -Fq 'attestations: write' "$release"
          grep -Fq 'artifact-metadata: write' "$release"
          grep -Fq 'packages: write' "$release"
          grep -Fq 'Validate protected publication request' "$release"
          grep -Fq 'refs/heads/main' "$release"
          grep -Fq 'NUGET_USER must be configured before official publication.' "$release"
          grep -Fq 'Checkout exact release commit' "$release"
          grep -Fq 'Download validated release candidate' "$release"
          grep -Fq 'sha256sum -c SHA256SUMS' "$release"
          grep -Fq 'actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2' "$release"
          grep -Fq 'Create or resume draft GitHub Release' "$release"
          grep -Fq -- '--draft' "$release"
          grep -Fq 'gh release upload' "$release"
          grep -Fq 'Authenticate to NuGet.org with trusted publishing' "$release"
          grep -Fq 'NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0' "$release"
          grep -Fq 'Publish packages to NuGet.org' "$release"
          grep -Fq 'Configure GitHub Packages source' "$release"
          grep -Fq 'Publish packages to GitHub Packages' "$release"
          grep -Fq 'Publish GitHub Release' "$release"
          grep -Fq -- '--draft=false' "$release"

          grep -Fq 'artifacts/release/${LIBRARY_PACKAGE_ID}.${RELEASE_VERSION}.nupkg' "$release"
          grep -Fq 'artifacts/release/RodriOliveira.DotNet.Library.Template.${RELEASE_VERSION}.nupkg' "$release"

          if grep -Eq 'secrets\.NUGET_API_KEY|write-all|artifacts/\*\*/\*.nupkg' "$release"; then
            echo 'Persistent NuGet credentials, broad permissions, or unsafe recursive package globs are not allowed.'
            exit 1
          fi

          if grep -Eq '^[[:space:]]{2}push:' "$release"; then
            echo 'The release workflow must not publish from push/tag events; official publication is workflow_dispatch-only.'
            exit 1
          fi

          id_token_jobs="$(awk '
            /^[[:space:]]{2}[A-Za-z0-9_-]+:$/ { job=$1; sub(":", "", job) }
            /id-token:[[:space:]]write/ { print job }
          ' "$release")"
          if [[ "$id_token_jobs" != 'publish' ]]; then
            echo "id-token: write must exist only in the publish job; got: $id_token_jobs"
            exit 1
          fi

      - name: Validate publishable package identities
        shell: bash
        run: |
          set -euo pipefail

          library_project='src/Template.Library/Template.Library.csproj'
          template_project='packaging/RodriOliveira.DotNet.Library.Template.csproj'

          library_package_id="$(dotnet msbuild "$library_project" -nologo -getProperty:PackageId             | tr -d '\r' | sed '/^[[:space:]]*$/d' | tail -n 1)"
          template_package_id="$(dotnet msbuild "$template_project" -nologo -getProperty:PackageId             | tr -d '\r' | sed '/^[[:space:]]*$/d' | tail -n 1)"
          template_package_type="$(dotnet msbuild "$template_project" -nologo -getProperty:PackageType             | tr -d '\r' | sed '/^[[:space:]]*$/d' | tail -n 1)"

          [[ "$library_package_id" == 'Template.Library' ]]
          [[ "$template_package_id" == 'RodriOliveira.DotNet.Library.Template' ]]
          [[ "$template_package_type" == 'Template' ]]

      - name: Install template from checkout
        run: dotnet new install .

      - name: Generate validation library
        shell: bash
        run: |
          set -euo pipefail

          generated="$RUNNER_TEMP/release-publishing-template/Validation.SampleLibrary"
          mkdir -p "$(dirname "$generated")"
          dotnet new rodri-lib -n Validation.SampleLibrary -o "$generated"
          echo "GENERATED_ROOT=$generated" >> "$GITHUB_ENV"

      - name: Validate generated release flow
        shell: bash
        run: |
          set -euo pipefail

          release="$GENERATED_ROOT/.github/workflows/release.yml"

          test -s "$release"
          grep -Fq 'src/Validation.SampleLibrary/Validation.SampleLibrary.csproj' "$release"
          grep -Fq 'name: Build release artifacts' "$release"
          grep -Fq 'name: Publish official release' "$release"
          grep -Fq "github.event_name == 'workflow_dispatch' && inputs.publish" "$release"
          grep -Fq 'environment: release' "$release"
          grep -Fq 'NUGET_USER' "$release"
          grep -Fq 'NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0' "$release"
          grep -Fq 'Publish packages to NuGet.org' "$release"
          grep -Fq 'Publish packages to GitHub Packages' "$release"
          grep -Fq 'Create or resume draft GitHub Release' "$release"
          grep -Fq 'SHA256SUMS' "$release"

          if [[ -e "$GENERATED_ROOT/.github/workflows/release-publishing-validation.yml" ]]; then
            echo 'Maintenance-only release publishing validation leaked into generated output.'
            exit 1
          fi

          if [[ -e "$GENERATED_ROOT/packaging" ]]; then
            echo 'Template-package packaging project leaked into generated output.'
            exit 1
          fi

          if [[ -e "$GENERATED_ROOT/.github/workflows/template-package-validation.yml" ||
                -e "$GENERATED_ROOT/scripts/verify-template-package.cs" ||
                -e "$GENERATED_ROOT/scripts/validate-template-package-e2e.sh" ]]; then
            echo 'Template-package maintenance assets leaked into generated output.'
            exit 1
          fi

      - name: Uninstall template
        if: always()
        run: dotnet new uninstall "$GITHUB_WORKSPACE" || true
