name: Release publishing validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-publishing-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication-gate:
    name: Validate release and NuGet publication flow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Validate release workflow contract
        shell: bash
        run: |
          release='.github/workflows/release.yml'
          request_resolver='scripts/resolve-release-request.sh'
          tag_guard='scripts/ensure-release-tag.sh'
          nuget_resolver='scripts/resolve-nuget-publishing.sh'

          test -s "$release"
          test -s "$request_resolver"
          test -s "$tag_guard"
          test -s "$nuget_resolver"

          grep -Fq "description: 'Release version" "$release"
          grep -Fq 'Validate release request' "$release"
          grep -Fq 'run: bash scripts/resolve-release-request.sh' "$release"
          grep -Fq 'is-manual-release:' "$release"
          grep -Fq 'Ensure release tag' "$release"
          grep -Fq 'Create or verify release tag' "$release"
          grep -Fq 'VALIDATED_SHA:' "$release"
          grep -Fq 'github.sha' "$release"
          grep -Fq 'run: bash scripts/ensure-release-tag.sh' "$release"
          grep -Fq 'nuget-publishing-enabled:' "$release"
          grep -Fq 'steps.nuget-publishing.outputs.nuget_publishing_enabled' "$release"
          grep -Fq 'Resolve NuGet publishing opt-in' "$release"
          grep -Fq 'NUGET_USER:' "$release"
          grep -Fq 'vars.NUGET_USER' "$release"
          grep -Fq 'run: bash scripts/resolve-nuget-publishing.sh' "$release"
          grep -Fq "if: needs.build-and-pack.outputs.nuget-publishing-enabled == 'true'" "$release"
          grep -Fq "needs.ensure-release-tag.result == 'success'" "$release"
          grep -Fq "needs.build-and-pack.outputs.nuget-publishing-enabled != 'true' ||" "$release"
          grep -Fq "needs.publish-nuget.result == 'success'" "$release"
          grep -Fq 'Create GitHub Release with package artifacts' "$release"
          grep -Fq 'Create source-template GitHub Release without package artifacts' "$release"
          grep -Fq 'GH_REPO:' "$release"
          grep -Fq 'github.repository' "$release"
          grep -Fq -- '--repo "$GH_REPO"' "$release"
          grep -Fq 'id-token: write' "$release"
          grep -Fq 'NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0' "$release"
          grep -Fq 'dotnet nuget push' "$release"

          if grep -Fq 'workflow_dispatch is dry-run' "$release" "$nuget_resolver"; then
            echo 'workflow_dispatch must be a real release path, not a dry run.'
            exit 1
          fi

          if grep -Eq 'secrets\.NUGET_API_KEY|write-all' "$release"; then
            echo 'Persistent NuGet credentials or broad permissions are not allowed.'
            exit 1
          fi

      - name: Validate NuGet publication decision matrix
        shell: bash
        run: |
          resolver='scripts/resolve-nuget-publishing.sh'

          assert_decision() {
            expected_enabled="$1"
            expected_reason="$2"
            should_publish="$3"
            safe_to_publish="$4"
            user_mode="$5"
            user_value="${6:-}"
            output="$(mktemp)"

            if [ "$user_mode" = 'absent' ]; then
              env -u NUGET_USER \
                SHOULD_PUBLISH="$should_publish" \
                SAFE_TO_PUBLISH="$safe_to_publish" \
                GITHUB_OUTPUT="$output" \
                bash "$resolver"
            else
              SHOULD_PUBLISH="$should_publish" \
                SAFE_TO_PUBLISH="$safe_to_publish" \
                NUGET_USER="$user_value" \
                GITHUB_OUTPUT="$output" \
                bash "$resolver"
            fi

            grep -Fxq "nuget_publishing_enabled=$expected_enabled" "$output"
            grep -Fxq "nuget_publishing_reason=$expected_reason" "$output"
            rm -f "$output"
          }

          assert_decision false nuget-user-not-configured true true absent
          assert_decision false nuget-user-not-configured true true configured ''
          assert_decision false nuget-user-not-configured true true configured '   '
          assert_decision true enabled true true configured 'nuget-profile'
          assert_decision false placeholder-package true false configured 'nuget-profile'
          assert_decision false release-disabled false true configured 'nuget-profile'

      - name: Validate manual release request rules
        shell: bash
        run: |
          resolver="$GITHUB_WORKSPACE/scripts/resolve-release-request.sh"
          root="$(mktemp -d)"
          remote="$root/remote.git"
          work="$root/work"

          git init --bare "$remote"
          git init -b main "$work"
          git -C "$work" config user.name 'Release Validation'
          git -C "$work" config user.email 'release-validation@example.invalid'
          echo baseline > "$work/file.txt"
          git -C "$work" add file.txt
          git -C "$work" commit -m 'Initial commit'
          git -C "$work" remote add origin "$remote"
          git -C "$work" push -u origin main

          output="$(mktemp)"
          (
            cd "$work"
            EVENT_NAME=workflow_dispatch \
              MANUAL_VERSION=v1.2.0 \
              REF_NAME=main \
              REF_TYPE=branch \
              RELEASE_BRANCH=main \
              GITHUB_OUTPUT="$output" \
              bash "$resolver"
          )
          grep -Fxq 'package_version=1.2.0' "$output"
          grep -Fxq 'release_tag=v1.2.0' "$output"
          grep -Fxq 'should_publish=true' "$output"
          grep -Fxq 'is_manual_release=true' "$output"
          rm -f "$output"

          if (
            cd "$work"
            EVENT_NAME=workflow_dispatch MANUAL_VERSION=v1.2.0 REF_NAME=feature REF_TYPE=branch bash "$resolver"
          ); then
            echo 'Manual release outside main should have failed.'
            exit 1
          fi

          if (
            cd "$work"
            EVENT_NAME=workflow_dispatch MANUAL_VERSION=1.2.0 REF_NAME=main REF_TYPE=branch bash "$resolver"
          ); then
            echo 'Release version without v prefix should have failed.'
            exit 1
          fi

          git -C "$work" tag v1.1.0
          git -C "$work" push origin refs/tags/v1.1.0
          if (
            cd "$work"
            EVENT_NAME=workflow_dispatch MANUAL_VERSION=v1.1.0 REF_NAME=main REF_TYPE=branch bash "$resolver"
          ); then
            echo 'Manual release with an existing tag should have failed.'
            exit 1
          fi

          output="$(mktemp)"
          (
            cd "$work"
            EVENT_NAME=push \
              REF_NAME=v1.1.0 \
              REF_TYPE=tag \
              GITHUB_OUTPUT="$output" \
              bash "$resolver"
          )
          grep -Fxq 'release_tag=v1.1.0' "$output"
          grep -Fxq 'is_manual_release=false' "$output"
          rm -f "$output"

      - name: Validate release tag creation and SHA guard
        shell: bash
        run: |
          tag_guard="$GITHUB_WORKSPACE/scripts/ensure-release-tag.sh"
          root="$(mktemp -d)"
          remote="$root/remote.git"
          work="$root/work"

          git init --bare "$remote"
          git init -b main "$work"
          git -C "$work" config user.name 'Release Validation'
          git -C "$work" config user.email 'release-validation@example.invalid'
          echo baseline > "$work/file.txt"
          git -C "$work" add file.txt
          git -C "$work" commit -m 'Initial commit'
          git -C "$work" remote add origin "$remote"
          git -C "$work" push -u origin main
          validated_sha="$(git -C "$work" rev-parse HEAD)"

          (
            cd "$work"
            IS_MANUAL_RELEASE=true \
              RELEASE_TAG=v2.0.0 \
              VALIDATED_SHA="$validated_sha" \
              bash "$tag_guard"
          )

          remote_tag_sha="$(git ls-remote "$remote" refs/tags/v2.0.0 | awk '{print $1}')"
          test "$remote_tag_sha" = "$validated_sha"

          if (
            cd "$work"
            IS_MANUAL_RELEASE=true RELEASE_TAG=v2.0.0 VALIDATED_SHA="$validated_sha" bash "$tag_guard"
          ); then
            echo 'Concurrent/existing manual tag should have been rejected.'
            exit 1
          fi

          (
            cd "$work"
            IS_MANUAL_RELEASE=false \
              RELEASE_TAG=v2.0.0 \
              VALIDATED_SHA="$validated_sha" \
              bash "$tag_guard"
          )

          echo changed >> "$work/file.txt"
          git -C "$work" add file.txt
          git -C "$work" commit -m 'Different commit'
          different_sha="$(git -C "$work" rev-parse HEAD)"

          if (
            cd "$work"
            IS_MANUAL_RELEASE=false RELEASE_TAG=v2.0.0 VALIDATED_SHA="$different_sha" bash "$tag_guard"
          ); then
            echo 'Tag pointing to a different SHA should have been rejected.'
            exit 1
          fi

          git -C "$work" push --force origin "$different_sha:refs/tags/v2.0.0"
          test "$(git -C "$work" rev-list -n 1 v2.0.0)" = "$validated_sha"
          if (
            cd "$work"
            IS_MANUAL_RELEASE=false RELEASE_TAG=v2.0.0 VALIDATED_SHA="$validated_sha" bash "$tag_guard"
          ); then
            echo 'A remotely moved tag must be rejected even when the checkout still has the old tag.'
            exit 1
          fi

          git -C "$work" push origin :refs/tags/v2.0.0
          if (
            cd "$work"
            IS_MANUAL_RELEASE=false RELEASE_TAG=v2.0.0 VALIDATED_SHA="$validated_sha" bash "$tag_guard"
          ); then
            echo 'A remotely deleted tag must be rejected before publication.'
            exit 1
          fi

      - name: Install template from checkout
        run: dotnet new install .

      - name: Generate validation library
        shell: bash
        run: |
          generated="$RUNNER_TEMP/release-publishing-template/Validation.SampleLibrary"
          mkdir -p "$(dirname "$generated")"
          dotnet new rodri-lib -n Validation.SampleLibrary -o "$generated"
          echo "GENERATED_ROOT=$generated" >> "$GITHUB_ENV"

      - name: Validate generated release flow
        shell: bash
        run: |
          release="$GENERATED_ROOT/.github/workflows/release.yml"
          request_resolver="$GENERATED_ROOT/scripts/resolve-release-request.sh"
          tag_guard="$GENERATED_ROOT/scripts/ensure-release-tag.sh"
          nuget_resolver="$GENERATED_ROOT/scripts/resolve-nuget-publishing.sh"

          test -s "$release"
          test -s "$request_resolver"
          test -s "$tag_guard"
          test -s "$nuget_resolver"
          grep -Fq 'src/Validation.SampleLibrary/Validation.SampleLibrary.csproj' "$release"
          grep -Fq 'run: bash scripts/resolve-release-request.sh' "$release"
          grep -Fq 'run: bash scripts/ensure-release-tag.sh' "$release"
          grep -Fq 'run: bash scripts/resolve-nuget-publishing.sh' "$release"
          grep -Fq 'GH_REPO:' "$release"
          grep -Fq 'github.repository' "$release"
          grep -Fq -- '--repo "$GH_REPO"' "$release"
          grep -Fq 'NUGET_USER' "$GENERATED_ROOT/README.md"
          grep -Fq 'Settings' "$GENERATED_ROOT/README.md"
          grep -Fq 'Secrets and variables' "$GENERATED_ROOT/README.md"

          output="$(mktemp)"
          SHOULD_PUBLISH=true \
            SAFE_TO_PUBLISH=true \
            NUGET_USER='' \
            GITHUB_OUTPUT="$output" \
            bash "$nuget_resolver"

          grep -Fxq 'nuget_publishing_enabled=false' "$output"
          grep -Fxq 'nuget_publishing_reason=nuget-user-not-configured' "$output"
          rm -f "$output"

          if [ -e "$GENERATED_ROOT/.github/workflows/release-publishing-validation.yml" ]; then
            echo 'Maintenance-only release publishing validation leaked into generated output.'
            exit 1
          fi

      - name: Uninstall template
        if: always()
        run: dotnet new uninstall "$GITHUB_WORKSPACE" || true
