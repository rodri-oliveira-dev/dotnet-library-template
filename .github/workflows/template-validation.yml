name: Validação do template

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: template-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-project:
    name: Gerar e validar Validation.SampleLibrary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Verificar baseline de agentes do checkout
        shell: bash
        run: |
          agent_files=(
            "AGENTS.md"
            ".agents/skills/dotnet-library-change/SKILL.md"
            ".agents/skills/dotnet-refactoring-engineer/SKILL.md"
            ".agents/skills/coverage-analysis/SKILL.md"
            ".agents/skills/test-anti-patterns/SKILL.md"
            ".agents/skills/ci-release-governance/SKILL.md"
          )

          for file in "${agent_files[@]}"; do
            if [ ! -s "$file" ]; then
              echo "Arquivo de orientação ausente ou vazio: $file"
              exit 1
            fi
          done

          grep -Fq 'Directory.Packages.props' AGENTS.md
          grep -Fq 'Directory.Build.props' AGENTS.md
          grep -Fq 'dotnet restore --locked-mode' AGENTS.md
          grep -Fq 'dotnet build --configuration Release --no-restore' AGENTS.md
          grep -Fq 'dotnet test --configuration Release --no-build' AGENTS.md
          grep -Fq 'CHANGELOG.md' AGENTS.md

          for file in "${agent_files[@]:1}"; do
            head -n 1 "$file" | grep -Fxq -- '---'
            grep -Eq '^name: [a-z0-9-]+$' "$file"
            grep -Fq 'description:' "$file"
          done

          forbidden='dotnet-library-template|WebApiCoreSeed|LedgerService|poc-arquitetura|web-api-core-seed|Dapper\.TypedParameters|DotNetRepoInspector|CrispyWaffle|complexity-analyzers'
          matches="$(grep -R -I -n -E "$forbidden" AGENTS.md .agents || true)"

          if [ -n "$matches" ]; then
            echo "Referência específica de outro repositório encontrada na baseline de agentes:"
            echo "$matches"
            exit 1
          fi

      - name: Verificar templates de colaboração do checkout
        shell: bash
        run: |
          collaboration_files=(
            ".github/ISSUE_TEMPLATE/bug_report.yml"
            ".github/ISSUE_TEMPLATE/feature_request.yml"
            ".github/pull_request_template.md"
          )

          for file in "${collaboration_files[@]}"; do
            if [ ! -s "$file" ]; then
              echo "Template de colaboração ausente ou vazio: $file"
              exit 1
            fi
          done

          grep -Fq 'name: Bug report' .github/ISSUE_TEMPLATE/bug_report.yml
          grep -Fq 'description:' .github/ISSUE_TEMPLATE/bug_report.yml
          grep -Fq 'body:' .github/ISSUE_TEMPLATE/bug_report.yml
          grep -Fq 'id: reproduction' .github/ISSUE_TEMPLATE/bug_report.yml
          grep -Fq 'id: dotnet' .github/ISSUE_TEMPLATE/bug_report.yml
          grep -Fq 'id: logs' .github/ISSUE_TEMPLATE/bug_report.yml

          grep -Fq 'name: Feature request' .github/ISSUE_TEMPLATE/feature_request.yml
          grep -Fq 'id: problem' .github/ISSUE_TEMPLATE/feature_request.yml
          grep -Fq 'id: solution' .github/ISSUE_TEMPLATE/feature_request.yml
          grep -Fq 'id: alternatives' .github/ISSUE_TEMPLATE/feature_request.yml
          grep -Fq 'id: public-api-impact' .github/ISSUE_TEMPLATE/feature_request.yml
          grep -Fq 'id: breaking-change' .github/ISSUE_TEMPLATE/feature_request.yml

          grep -Fq '## Related issue' .github/pull_request_template.md
          grep -Fq 'dotnet build --configuration Release --no-restore' .github/pull_request_template.md
          grep -Fq 'dotnet test --configuration Release --no-build' .github/pull_request_template.md
          grep -Fq 'CHANGELOG.md' .github/pull_request_template.md
          grep -Fq 'Breaking changes' .github/pull_request_template.md
          grep -Fq 'New dependencies' .github/pull_request_template.md
          grep -Fq 'sensitive information' .github/pull_request_template.md

      - name: Verificar configuração do Dependabot no checkout
        shell: bash
        run: |
          file=".github/dependabot.yml"

          if [ ! -s "$file" ]; then
            echo "Configuração do Dependabot ausente ou vazia."
            exit 1
          fi

          grep -Eq '^version: 2$' "$file"
          grep -Fq 'package-ecosystem: "nuget"' "$file"
          grep -Fq 'package-ecosystem: "github-actions"' "$file"

          if [ "$(grep -Fc 'directory: "/"' "$file")" -ne 2 ]; then
            echo "NuGet e GitHub Actions devem monitorar a raiz do repositório."
            exit 1
          fi

          if [ "$(grep -Fc 'interval: "weekly"' "$file")" -ne 2 ]; then
            echo "Ambos os ecossistemas devem usar frequência semanal."
            exit 1
          fi

          if [ "$(grep -Fc 'timezone: "America/Sao_Paulo"' "$file")" -ne 2 ]; then
            echo "Ambos os ecossistemas devem declarar timezone explícito."
            exit 1
          fi

          if [ "$(grep -Fc 'open-pull-requests-limit: 5' "$file")" -ne 2 ]; then
            echo "Ambos os ecossistemas devem limitar PRs simultâneos."
            exit 1
          fi

          grep -Fq 'update-types:' "$file"
          grep -Fq -- '- "minor"' "$file"
          grep -Fq -- '- "patch"' "$file"

          if grep -Eq 'registries:|secrets\.|token:|password:' "$file"; then
            echo "A baseline do Dependabot não deve conter registry privado ou credencial."
            exit 1
          fi

      - name: Verificar configuração do CodeQL no checkout
        shell: bash
        run: |
          file=".github/workflows/codeql.yml"

          if [ ! -s "$file" ]; then
            echo "Workflow CodeQL ausente ou vazio."
            exit 1
          fi

          grep -Fq 'pull_request:' "$file"
          grep -Fq 'push:' "$file"
          grep -Fq 'schedule:' "$file"
          grep -Fq 'contents: read' "$file"
          grep -Fq 'security-events: write' "$file"
          grep -Fq 'github/codeql-action/init@4c0873ef8656cb3c50b3f42fb63bc1ade0cfa827 # v4' "$file"
          grep -Fq 'github/codeql-action/analyze@4c0873ef8656cb3c50b3f42fb63bc1ade0cfa827 # v4' "$file"
          grep -Fq 'languages: csharp' "$file"
          grep -Fq 'build-mode: manual' "$file"
          grep -Fq 'dotnet restore Template.Library.slnx --locked-mode' "$file"
          grep -Fq 'dotnet build Template.Library.slnx --configuration Release --no-restore' "$file"

          if grep -Eq 'write-all|secrets\.|github/codeql-action/autobuild|packages: write|contents: write' "$file"; then
            echo "Workflow CodeQL contém permissão, secret ou autobuild não permitido pela baseline."
            exit 1
          fi
      - name: Verificar workflows de dependências e release no checkout
        shell: bash
        run: |
          dependency_review='.github/workflows/dependency-review.yml'
          release='.github/workflows/release.yml'

          test -s "$dependency_review"
          grep -Fq 'actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0' "$dependency_review"
          grep -Fq 'fail-on-severity: high' "$dependency_review"
          grep -Fq 'contents: read' "$dependency_review"

          test -s "$release"
          grep -Fq 'workflow_dispatch:' "$release"
          grep -Fq 'NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0' "$release"
          grep -Fq 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7' "$release"
          grep -Fq 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8' "$release"
          grep -Fq 'id-token: write' "$release"
          grep -Fq 'contents: write' "$release"
          grep -Fq 'safe-to-publish' "$release"
          grep -Fq 'placeholder_package_id="Template"".""Library"' "$release"
          grep -Fq 'vars.NUGET_USER' "$release"
          grep -Fq -- '--expected-version' "$release"

          if grep -Eq 'secrets\.NUGET_API_KEY|write-all|1341282709|rodri-oliveira-dev/dotnet-library-template' "$release"; then
            echo "Workflow de release contém credencial persistente, permissão ou metadado específico do repositório-base."
            exit 1
          fi

          unpinned="$(grep -R -n -E '^[[:space:]]*uses: [^#[:space:]]+@[A-Za-z0-9._-]+' .github/workflows \
            | grep -Ev '@[0-9a-f]{40}([[:space:]]|$)' || true)"
          if [ -n "$unpinned" ]; then
            echo "Actions sem pin por SHA completo:"
            echo "$unpinned"
            exit 1
          fi

          missing_version_comment="$(grep -R -n -E '^[[:space:]]*uses: [^#[:space:]]+@[0-9a-f]{40}([[:space:]]|$)' .github/workflows \
            | grep -Ev '# v[0-9]' || true)"
          if [ -n "$missing_version_comment" ]; then
            echo "Actions pinadas sem comentario de versao:"
            echo "$missing_version_comment"
            exit 1
          fi

          missing_readonly_checkout="$(
            for workflow in .github/workflows/*.yml; do
              awk -v file="$workflow" '
                function flush() {
                  if (checkout && !exception && block !~ /persist-credentials:[[:space:]]false/) {
                    print checkout_line
                  }
                }

                /^[[:space:]]*-[[:space:]]name:[[:space:]]*/ {
                  flush()
                  block = $0 "\n"
                  checkout = 0
                  exception = ($0 ~ /Checkout validated commit/)
                  next
                }

                {
                  block = block $0 "\n"
                  if ($0 ~ /^[[:space:]]*uses:[[:space:]]actions\/checkout@[0-9a-f]{40}/) {
                    checkout = 1
                    checkout_line = file ":" FNR ":" $0
                  }
                }

                END {
                  flush()
                }
              ' "$workflow"
            done
          )"

          if [ -n "$missing_readonly_checkout" ]; then
            echo "Checkouts read-only devem declarar persist-credentials:false:"
            echo "$missing_readonly_checkout"
            exit 1
          fi

      - name: Instalar template do checkout
        run: dotnet new install .

      - name: Confirmar registro do template
        shell: bash
        run: |
          listing="$(dotnet new list rodri-lib)"
          echo "$listing"

          if [[ "$listing" != *"rodri-lib"* ]]; then
            echo "Template rodri-lib não foi registrado no dotnet new."
            exit 1
          fi

      - name: Gerar biblioteca de validação
        shell: bash
        run: |
          generated="$RUNNER_TEMP/generated-template/Validation.SampleLibrary"
          mkdir -p "$(dirname "$generated")"
          dotnet new rodri-lib -n Validation.SampleLibrary -o "$generated"
          echo "GENERATED_ROOT=$generated" >> "$GITHUB_ENV"

      - name: Verificar estrutura gerada
        shell: bash
        run: |
          required=(
            "Validation.SampleLibrary.slnx"
            "src/Validation.SampleLibrary/Validation.SampleLibrary.csproj"
            "src/Validation.SampleLibrary/packages.lock.json"
            "tests/Validation.SampleLibrary.Tests/Validation.SampleLibrary.Tests.csproj"
            "tests/Validation.SampleLibrary.Tests/packages.lock.json"
            "README.md"
            "CONTRIBUTING.md"
            "CODE_OF_CONDUCT.md"
            "SECURITY.md"
            "CHANGELOG.md"
            "AGENTS.md"
            ".editorconfig"
            "global.json"
            ".agents/skills/dotnet-library-change/SKILL.md"
            ".agents/skills/dotnet-refactoring-engineer/SKILL.md"
            ".agents/skills/coverage-analysis/SKILL.md"
            ".agents/skills/test-anti-patterns/SKILL.md"
            ".agents/skills/ci-release-governance/SKILL.md"
            ".github/ISSUE_TEMPLATE/bug_report.yml"
            ".github/ISSUE_TEMPLATE/feature_request.yml"
            ".github/pull_request_template.md"
            ".github/dependabot.yml"
            ".github/workflows/ci.yml"
            ".github/workflows/codeql.yml"
            ".github/workflows/dependency-review.yml"
            ".github/workflows/release.yml"
            "scripts/verify-package.cs"
          )

          for path in "${required[@]}"; do
            if [ ! -e "$GENERATED_ROOT/$path" ]; then
              echo "Arquivo esperado não foi gerado: $path"
              exit 1
            fi
          done

          if [ -e "$GENERATED_ROOT/.github/workflows/validation.yml" ]; then
            echo "Workflow legado validation.yml não deve existir na saída gerada."
            exit 1
          fi

          maintenance_only=(
            ".template.config/template.json"
            ".github/workflows/initialize-repository.yml"
            ".github/workflows/template-validation.yml"
            ".github/workflows/sonar-template-validation.yml"
            ".github/workflows/versioning-validation.yml"
            ".github/workflows/release-publishing-validation.yml"
            ".github/workflows/github-template-initialization-validation.yml"
            "docs/template-development.md"
            "docs/repository-administration.md"
            "docs/library-readme.md"
            "README.en.md"
            "scripts/initialize-repository.sh"
          )

          for path in "${maintenance_only[@]}"; do
            if [ -e "$GENERATED_ROOT/$path" ]; then
              echo "Conteúdo exclusivo de manutenção vazou para a saída: $path"
              exit 1
            fi
          done

          grep -Fq '# Validation.SampleLibrary' "$GENERATED_ROOT/README.md"
          grep -Fq 'Directory.Packages.props' "$GENERATED_ROOT/AGENTS.md"
          grep -Fq 'name: Bug report' "$GENERATED_ROOT/.github/ISSUE_TEMPLATE/bug_report.yml"
          grep -Fq 'name: Feature request' "$GENERATED_ROOT/.github/ISSUE_TEMPLATE/feature_request.yml"
          grep -Fq 'dotnet build --configuration Release --no-restore' "$GENERATED_ROOT/.github/pull_request_template.md"
          grep -Fq 'package-ecosystem: "nuget"' "$GENERATED_ROOT/.github/dependabot.yml"
          grep -Fq 'package-ecosystem: "github-actions"' "$GENERATED_ROOT/.github/dependabot.yml"
          grep -Fq '"version": "10.0.303"' "$GENERATED_ROOT/global.json"
          grep -Fq '"rollForward": "latestFeature"' "$GENERATED_ROOT/global.json"
          grep -Fq '"runner": "Microsoft.Testing.Platform"' "$GENERATED_ROOT/global.json"
          grep -Fq 'csharp_preferred_modifier_order = file,public,protected,internal,private,static,abstract,virtual,override,sealed,readonly,required,extern,new,unsafe,volatile,async:suggestion' "$GENERATED_ROOT/.editorconfig"
          grep -Fq 'dotnet_diagnostic.CA1062.severity = warning' "$GENERATED_ROOT/.editorconfig"
          grep -Fq 'dotnet_diagnostic.CA1859.severity = suggestion' "$GENERATED_ROOT/.editorconfig"
          grep -Fq 'privately report suspected vulnerabilities' "$GENERATED_ROOT/SECURITY.md"
          grep -Fq 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7' "$GENERATED_ROOT/.github/workflows/ci.yml"
          grep -Fq 'persist-credentials: false' "$GENERATED_ROOT/.github/workflows/ci.yml"
          grep -Fq 'cancel-in-progress: true' "$GENERATED_ROOT/.github/workflows/ci.yml"
          grep -Fq 'github/codeql-action/init@4c0873ef8656cb3c50b3f42fb63bc1ade0cfa827 # v4' "$GENERATED_ROOT/.github/workflows/codeql.yml"
          grep -Fq 'github/codeql-action/analyze@4c0873ef8656cb3c50b3f42fb63bc1ade0cfa827 # v4' "$GENERATED_ROOT/.github/workflows/codeql.yml"
          grep -Fq 'build-mode: manual' "$GENERATED_ROOT/.github/workflows/codeql.yml"
          grep -Fq 'security-events: write' "$GENERATED_ROOT/.github/workflows/codeql.yml"
          grep -Fq 'dotnet restore Validation.SampleLibrary.slnx --locked-mode' "$GENERATED_ROOT/.github/workflows/codeql.yml"
          grep -Fq 'dotnet build Validation.SampleLibrary.slnx --configuration Release --no-restore' "$GENERATED_ROOT/.github/workflows/codeql.yml"
          grep -Fq 'actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0' "$GENERATED_ROOT/.github/workflows/dependency-review.yml"
          grep -Fq 'fail-on-severity: high' "$GENERATED_ROOT/.github/workflows/dependency-review.yml"
          grep -Fq 'NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0' "$GENERATED_ROOT/.github/workflows/release.yml"
          grep -Fq 'safe-to-publish' "$GENERATED_ROOT/.github/workflows/release.yml"
          grep -Fq 'placeholder_package_id="Template"".""Library"' "$GENERATED_ROOT/.github/workflows/release.yml"
          grep -Fq 'dotnet restore Validation.SampleLibrary.slnx --locked-mode' "$GENERATED_ROOT/.github/workflows/release.yml"
          grep -Fq 'dotnet build Validation.SampleLibrary.slnx' "$GENERATED_ROOT/.github/workflows/release.yml"
          grep -Fq 'src/Validation.SampleLibrary/Validation.SampleLibrary.csproj' "$GENERATED_ROOT/.github/workflows/release.yml"
          grep -Fq 'vars.NUGET_USER' "$GENERATED_ROOT/.github/workflows/release.yml"
          grep -Fq 'Trusted Publishing' "$GENERATED_ROOT/README.md"

          generated_unpinned="$(grep -R -n -E '^[[:space:]]*uses: [^#[:space:]]+@[A-Za-z0-9._-]+' "$GENERATED_ROOT/.github/workflows" \
            | grep -Ev '@[0-9a-f]{40}([[:space:]]|$)' || true)"
          if [ -n "$generated_unpinned" ]; then
            echo "Actions sem pin por SHA completo na saida gerada:"
            echo "$generated_unpinned"
            exit 1
          fi

          generated_missing_readonly_checkout="$(
            for workflow in "$GENERATED_ROOT"/.github/workflows/*.yml; do
              awk -v file="$workflow" '
                function flush() {
                  if (checkout && !exception && block !~ /persist-credentials:[[:space:]]false/) {
                    print checkout_line
                  }
                }

                /^[[:space:]]*-[[:space:]]name:[[:space:]]*/ {
                  flush()
                  block = $0 "\n"
                  checkout = 0
                  exception = ($0 ~ /Checkout validated commit/)
                  next
                }

                {
                  block = block $0 "\n"
                  if ($0 ~ /^[[:space:]]*uses:[[:space:]]actions\/checkout@[0-9a-f]{40}/) {
                    checkout = 1
                    checkout_line = file ":" FNR ":" $0
                  }
                }

                END {
                  flush()
                }
              ' "$workflow"
            done
          )"

          if [ -n "$generated_missing_readonly_checkout" ]; then
            echo "Checkouts read-only da saida gerada devem declarar persist-credentials:false:"
            echo "$generated_missing_readonly_checkout"
            exit 1
          fi

      - name: Inicializar contexto Git da saída
        shell: bash
        run: |
          git -C "$GENERATED_ROOT" init -b main
          git -C "$GENERATED_ROOT" config user.name "Template Validation"
          git -C "$GENERATED_ROOT" config user.email "template-validation@example.invalid"
          git -C "$GENERATED_ROOT" add --all
          git -C "$GENERATED_ROOT" commit -m "Initial generated library"
          git -C "$GENERATED_ROOT" remote add origin https://github.com/example/Validation.SampleLibrary.git

      - name: Restaurar ferramentas locais da saída
        working-directory: ${{ env.GENERATED_ROOT }}
        run: dotnet tool restore

      - name: Restaurar dependências da saída em locked mode
        working-directory: ${{ env.GENERATED_ROOT }}
        run: dotnet restore --locked-mode

      - name: Verificar politicas MSBuild da saida
        working-directory: ${{ env.GENERATED_ROOT }}
        shell: bash
        run: |
          project="src/Validation.SampleLibrary/Validation.SampleLibrary.csproj"

          get_property() {
            dotnet msbuild "$project" -nologo -getProperty:"$1" \
              | tr -d '\r' \
              | sed '/^[[:space:]]*$/d' \
              | tail -n 1
          }

          test "$(get_property AnalysisLevel)" = "10-recommended"
          test "$(get_property AnalysisLevelSecurity)" = "10-all"
          test "$(get_property EnforceCodeStyleInBuild)" = "true"
          test "$(get_property EnablePackageValidation)" = "true"
          test "$(get_property PackageReadmeFile)" = "README.md"

      - name: Verificar formatação da saída
        working-directory: ${{ env.GENERATED_ROOT }}
        run: dotnet format --verify-no-changes --no-restore

      - name: Compilar saída
        working-directory: ${{ env.GENERATED_ROOT }}
        run: dotnet build --configuration Release --no-restore

      - name: Executar testes da saída
        working-directory: ${{ env.GENERATED_ROOT }}
        run: dotnet test --configuration Release --no-build

      - name: Empacotar saída
        working-directory: ${{ env.GENERATED_ROOT }}
        run: >-
          dotnet pack src/Validation.SampleLibrary/Validation.SampleLibrary.csproj
          --configuration Release
          --no-build
          --output artifacts/packages

      - name: Validar pacote e Source Link da saída
        working-directory: ${{ env.GENERATED_ROOT }}
        run: dotnet run --file scripts/verify-package.cs -- artifacts/packages --require-source-link

      - name: Verificar identidade do pacote
        shell: bash
        run: |
          package="$GENERATED_ROOT/artifacts/packages/Validation.SampleLibrary.1.0.0.nupkg"
          symbols="$GENERATED_ROOT/artifacts/packages/Validation.SampleLibrary.1.0.0.snupkg"
          test -f "$package"
          test -f "$symbols"

      - name: Verificar ausência de resíduos
        shell: bash
        run: |
          forbidden='Template\.Library|Dapper\.TypedParameters|DotNetRepoInspector|CrispyWaffle|complexity-analyzers|dotnet-library-template|WebApiCoreSeed|LedgerService|poc-arquitetura|web-api-core-seed'
          matches="$(grep -R -I -n -E "$forbidden" "$GENERATED_ROOT" \
            --exclude-dir=.git \
            --exclude-dir=bin \
            --exclude-dir=obj \
            --exclude-dir=artifacts || true)"

          if [ -n "$matches" ]; then
            echo "Identidade indevida encontrada na saída gerada:"
            echo "$matches"
            exit 1
          fi

      - name: Desinstalar template
        if: always()
        run: dotnet new uninstall "$GITHUB_WORKSPACE" || true
