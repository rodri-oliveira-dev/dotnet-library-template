name: Validate Dependabot SDK baseline

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/dependabot.yml'
      - '.github/workflows/dependabot-sdk-validation.yml'
      - '.template.config/template.json'
      - 'global.json'
  push:
    branches:
      - main
    paths:
      - '.github/dependabot.yml'
      - '.github/workflows/dependabot-sdk-validation.yml'
      - '.template.config/template.json'
      - 'global.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependabot-sdk-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate SDK dependency maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Validate source Dependabot baseline
        shell: bash
        run: |
          set -euo pipefail
          file='.github/dependabot.yml'

          test -s "$file"
          grep -Eq '^version: 2$' "$file"
          grep -Fq 'package-ecosystem: "nuget"' "$file"
          grep -Fq 'package-ecosystem: "dotnet-sdk"' "$file"
          grep -Fq 'package-ecosystem: "github-actions"' "$file"

          test "$(grep -Fc 'directory: "/"' "$file")" -eq 3
          test "$(grep -Fc 'interval: "weekly"' "$file")" -eq 3
          test "$(grep -Fc 'timezone: "America/Sao_Paulo"' "$file")" -eq 3
          grep -Fq 'open-pull-requests-limit: 2' "$file"

          if grep -Eq 'registries:|secrets\.|token:|password:' "$file"; then
            echo 'Dependabot baseline must not contain private registry credentials.'
            exit 1
          fi

      - name: Install template from checkout
        run: dotnet new install .

      - name: Generate validation library
        shell: bash
        run: |
          set -euo pipefail
          generated="$RUNNER_TEMP/dependabot-sdk-validation/Validation.SampleLibrary"
          mkdir -p "$(dirname "$generated")"
          dotnet new rodri-lib -n Validation.SampleLibrary -o "$generated"
          echo "GENERATED_ROOT=$generated" >> "$GITHUB_ENV"

      - name: Validate generated dependency baseline
        shell: bash
        run: |
          set -euo pipefail
          file="$GENERATED_ROOT/.github/dependabot.yml"

          test -s "$file"
          grep -Fq 'package-ecosystem: "nuget"' "$file"
          grep -Fq 'package-ecosystem: "dotnet-sdk"' "$file"
          grep -Fq 'package-ecosystem: "github-actions"' "$file"

          if ! cmp -s global.json "$GENERATED_ROOT/global.json"; then
            echo 'Generated global.json diverges from the source template.'
            diff -u global.json "$GENERATED_ROOT/global.json" || true
            exit 1
          fi

          if [ -e "$GENERATED_ROOT/.github/workflows/dependabot-sdk-validation.yml" ]; then
            echo 'Template-maintenance validation workflow leaked into generated output.'
            exit 1
          fi

      - name: Uninstall template
        if: always()
        run: dotnet new uninstall "$GITHUB_WORKSPACE" || true
