name: Temporary Sonar security audit

on:
  push:
    branches:
      - fix/sonar-security-issues

permissions:
  contents: read

jobs:
  audit:
    name: Query open Sonar security issues
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: rodri-oliveira-dev_dotnet-library-template
    steps:
      - name: Query SonarQube Cloud API
        shell: bash
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo '::error::SONAR_TOKEN is not configured.'
            exit 1
          fi

          curl --fail --silent --show-error \
            --user "$SONAR_TOKEN:" \
            --get 'https://sonarcloud.io/api/issues/search' \
            --data-urlencode "componentKeys=$SONAR_PROJECT_KEY" \
            --data-urlencode 'branch=main' \
            --data-urlencode 'issueStatuses=OPEN,CONFIRMED' \
            --data-urlencode 'impactSoftwareQualities=SECURITY' \
            --data-urlencode 'ps=500' \
            > sonar-issues.raw.json

          jq '{total, issues: [.issues[] | {key, rule, component, project, line, message, severity, impacts, status, cleanCodeAttribute, creationDate, updateDate}]}' \
            sonar-issues.raw.json > sonar-security-issues.json

          echo '--- Sonar security issues ---'
          jq -r '.issues[] | [.key, .rule, .component, (.line // 0), .severity, .status, .message] | @tsv' sonar-security-issues.json
          echo "Total: $(jq -r '.total' sonar-security-issues.json)"

      - name: Upload sanitized audit
        uses: actions/upload-artifact@v7
        with:
          name: sonar-security-issues
          path: sonar-security-issues.json
          if-no-files-found: error
          retention-days: 1
