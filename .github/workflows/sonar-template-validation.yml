name: Validação do template Sonar

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: sonar-template-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disabled-contract:
    name: Validar Sonar sem token
    runs-on: ubuntu-latest
    permissions: {}
    env:
      SONAR_TOKEN: ''

    steps:
      - name: Confirmar caminho opt-in desabilitado
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "Sonar desabilitado sem token, como esperado."

      - name: Falhar se caminho Sonar for ativado sem token
        if: ${{ env.SONAR_TOKEN != '' }}
        run: exit 1

  generated-contract:
    name: Validar Sonar no projeto gerado
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Verificar contrato Sonar do checkout
        shell: bash
        run: |
          workflow='.github/workflows/sonar.yml'
          sync_workflow='.github/workflows/sonar-quality-issues.yml'
          sync_script='.github/scripts/sync-sonar-quality-issues.js'
          sync_docs='docs/sonar-quality-issues.md'
          sync_docs_pt='docs/sonar-quality-issues.pt-BR.md'
          manifest='.config/dotnet-tools.json'
          resolver='scripts/resolve-sonar-project-version.sh'

          test -s "$workflow"
          test -s "$sync_workflow"
          test -s "$sync_script"
          test -s "$sync_docs"
          test -s "$sync_docs_pt"
          test -s "$manifest"
          test -s "$resolver"

          grep -Fq '"dotnet-sonarscanner"' "$manifest"
          grep -Fq '"version": "11.2.1"' "$manifest"
          grep -Fq 'pull_request:' "$workflow"
          grep -Fq 'push:' "$workflow"
          grep -Fq 'contents: read' "$workflow"
          grep -Fq 'SONAR_TOKEN:' "$workflow"
          grep -Fq 'secrets.SONAR_TOKEN' "$workflow"
          grep -Fq 'vars.SONAR_PROJECT_KEY' "$workflow"
          grep -Fq 'vars.SONAR_ORGANIZATION' "$workflow"
          grep -Fq 'vars.SONAR_HOST_URL' "$workflow"
          grep -Fq 'github.repository_owner' "$workflow"
          grep -Fq 'github.event.repository.name' "$workflow"
          grep -Fq 'https://sonarcloud.io' "$workflow"
          grep -Fq 'fetch-depth: 0' "$workflow"
          grep -Fq 'env.SONAR_TOKEN == ' "$workflow"
          grep -Fq 'env.SONAR_TOKEN != ' "$workflow"
          grep -Fq 'github.event.pull_request.head.repo.fork' "$workflow"
          grep -Fq 'dotnet tool restore' "$workflow"
          grep -Fq 'dotnet restore Template.Library.slnx --locked-mode' "$workflow"
          grep -Fq 'scripts/resolve-sonar-project-version.sh' "$workflow"
          grep -Fq 'dotnet sonarscanner begin' "$workflow"
          grep -Fq '/d:sonar.cs.opencover.reportsPaths="**/coverage.opencover*.xml"' "$workflow"
          grep -Fq '/d:sonar.coverage.exclusions=".github/scripts/sync-sonar-quality-issues.js"' "$workflow"
          grep -Fq '/d:sonar.qualitygate.wait=true' "$workflow"
          grep -Fq 'dotnet build Template.Library.slnx --configuration Release --no-restore --no-incremental' "$workflow"
          grep -Fq -- '--coverlet-output-format opencover' "$workflow"
          grep -Fq 'dotnet sonarscanner end' "$workflow"

          grep -Fq 'schedule:' "$sync_workflow"
          grep -Fq 'workflow_dispatch:' "$sync_workflow"
          grep -Fq 'contents: read' "$sync_workflow"
          grep -Fq 'issues: write' "$sync_workflow"
          grep -Fq 'secrets.SONAR_TOKEN' "$sync_workflow"
          grep -Fq 'vars.SONAR_PROJECT_KEY' "$sync_workflow"
          grep -Fq 'vars.SONAR_HOST_URL' "$sync_workflow"
          grep -Fq 'vars.SONAR_ISSUE_LABEL' "$sync_workflow"
          grep -Fq 'github.repository_owner' "$sync_workflow"
          grep -Fq 'github.event.repository.name' "$sync_workflow"
          grep -Fq 'https://sonarcloud.io' "$sync_workflow"
          grep -Fq 'persist-credentials: false' "$sync_workflow"
          grep -Fq 'actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3' "$sync_workflow"
          grep -Fq "require('./.github/scripts/sync-sonar-quality-issues.js')" "$sync_workflow"
          grep -Fq "issueStatuses: 'OPEN'" "$sync_script"
          grep -Fq "impactSeverities: 'BLOCKER,HIGH'" "$sync_script"
          grep -Fq "state: 'closed'" "$sync_script"
          grep -Fq "state: needsReopen ? 'open' : undefined" "$sync_script"
          grep -Fq 'sonar-issue-key:' "$sync_script"
          grep -Fq 'github-actions[bot]' "$sync_script"
          node --check "$sync_script"

          if grep -Fq '/d:sonar.exclusions="scripts/**"' "$workflow"; then
            echo "scripts/** não deve ser removido da análise Sonar."
            exit 1
          fi

          if grep -Fq '/d:sonar.exclusions=".github/scripts/sync-sonar-quality-issues.js"' "$workflow"; then
            echo "O sincronizador pode ser excluído de cobertura, mas deve continuar na análise de qualidade do Sonar."
            exit 1
          fi

          if grep -E -q 'rodri-oliveira-dev_(dotnet-library-template|complexity-analyzers)|rodri-oliveira-dev/(dotnet-library-template|complexity-analyzers)' \
            "$workflow" "$sync_workflow" "$sync_script" "$sync_docs" "$sync_docs_pt"; then
            echo "Integração Sonar contém identidade específica de um source repository."
            exit 1
          fi

      - name: Validar precedência SemVer do resolver Sonar
        shell: bash
        run: |
          resolver="$GITHUB_WORKSPACE/scripts/resolve-sonar-project-version.sh"
          sandbox="$RUNNER_TEMP/sonar-version-resolution"
          rm -rf "$sandbox"
          mkdir -p "$sandbox"
          cd "$sandbox"

          git init --quiet
          git config user.name 'Template Validation'
          git config user.email 'template-validation@example.invalid'
          touch marker
          git add marker
          git commit --quiet -m 'validation fixture'

          for tag in \
            v1.2.9 \
            v1.3.0-alpha \
            v1.3.0-beta.1 \
            v1.3.0-beta.2 \
            v1.3.0-beta.10 \
            v1.3.0-rc.1 \
            v1.3.0; do
            git tag "$tag"
          done

          resolution="$(FALLBACK_VERSION=0.9.0 bash "$resolver")"
          grep -Fxq 'version=1.3.0' <<< "$resolution"
          grep -Fxq 'source=release tag v1.3.0' <<< "$resolution"

          git tag -d v1.3.0 >/dev/null
          resolution="$(FALLBACK_VERSION=0.9.0 bash "$resolver")"
          grep -Fxq 'version=1.3.0-rc.1' <<< "$resolution"

          for tag in $(git tag); do
            git tag -d "$tag" >/dev/null
          done

          resolution="$(FALLBACK_VERSION=0.9.0 bash "$resolver")"
          grep -Fxq 'version=0.9.0' <<< "$resolution"
          grep -Fxq 'source=PackageVersion fallback' <<< "$resolution"

      - name: Restaurar ferramentas locais
        run: dotnet tool restore

      - name: Confirmar SonarScanner local
        shell: bash
        run: |
          tools="$(dotnet tool list --local)"
          echo "$tools"
          grep -Fq 'dotnet-sonarscanner' <<< "$tools"
          grep -Fq '11.2.1' <<< "$tools"

      - name: Instalar template do checkout
        run: dotnet new install .

      - name: Gerar biblioteca de validação
        shell: bash
        run: |
          generated="$RUNNER_TEMP/generated-sonar-template/Validation.SampleLibrary"
          mkdir -p "$(dirname "$generated")"
          dotnet new rodri-lib -n Validation.SampleLibrary -o "$generated"
          echo "GENERATED_ROOT=$generated" >> "$GITHUB_ENV"

      - name: Verificar contrato Sonar da saída
        shell: bash
        run: |
          workflow="$GENERATED_ROOT/.github/workflows/sonar.yml"
          sync_workflow="$GENERATED_ROOT/.github/workflows/sonar-quality-issues.yml"
          sync_script="$GENERATED_ROOT/.github/scripts/sync-sonar-quality-issues.js"
          manifest="$GENERATED_ROOT/.config/dotnet-tools.json"
          resolver="$GENERATED_ROOT/scripts/resolve-sonar-project-version.sh"
          readme="$GENERATED_ROOT/README.md"

          test -s "$workflow"
          test -s "$sync_workflow"
          test -s "$sync_script"
          test -s "$manifest"
          test -s "$resolver"
          test -s "$readme"
          test ! -e "$GENERATED_ROOT/.github/workflows/sonar-template-validation.yml"

          grep -Fq '"dotnet-sonarscanner"' "$manifest"
          grep -Fq '"version": "11.2.1"' "$manifest"
          grep -Fq 'dotnet restore Validation.SampleLibrary.slnx --locked-mode' "$workflow"
          grep -Fq 'dotnet build Validation.SampleLibrary.slnx --configuration Release --no-restore --no-incremental' "$workflow"
          grep -Fq 'SONAR_TOKEN' "$workflow"
          grep -Fq 'vars.SONAR_PROJECT_KEY' "$workflow"
          grep -Fq 'vars.SONAR_ORGANIZATION' "$workflow"
          grep -Fq 'vars.SONAR_HOST_URL' "$workflow"
          grep -Fq 'scripts/resolve-sonar-project-version.sh' "$workflow"
          grep -Fq '/d:sonar.coverage.exclusions=".github/scripts/sync-sonar-quality-issues.js"' "$workflow"
          grep -Fq 'Optional SonarQube Cloud analysis' "$readme"

          grep -Fq 'schedule:' "$sync_workflow"
          grep -Fq 'workflow_dispatch:' "$sync_workflow"
          grep -Fq 'issues: write' "$sync_workflow"
          grep -Fq 'vars.SONAR_PROJECT_KEY' "$sync_workflow"
          grep -Fq 'vars.SONAR_HOST_URL' "$sync_workflow"
          grep -Fq 'vars.SONAR_ISSUE_LABEL' "$sync_workflow"
          grep -Fq "require('./.github/scripts/sync-sonar-quality-issues.js')" "$sync_workflow"
          grep -Fq "impactSeverities: 'BLOCKER,HIGH'" "$sync_script"
          grep -Fq "state: 'closed'" "$sync_script"
          node --check "$sync_script"

          if grep -Fq '/d:sonar.exclusions="scripts/**"' "$workflow"; then
            echo "Saída gerada exclui scripts/** indevidamente da análise Sonar."
            exit 1
          fi

          if grep -Fq '/d:sonar.exclusions=".github/scripts/sync-sonar-quality-issues.js"' "$workflow"; then
            echo "Saída gerada removeu indevidamente o sincronizador da análise de qualidade do Sonar."
            exit 1
          fi

          if grep -R -I -n -E 'rodri-oliveira-dev_(dotnet-library-template|complexity-analyzers)|rodri-oliveira-dev/(dotnet-library-template|complexity-analyzers)' "$GENERATED_ROOT" \
            --exclude-dir=.git --exclude-dir=bin --exclude-dir=obj --exclude-dir=artifacts; then
            echo "Identidade Sonar de source repository vazou para a saída gerada."
            exit 1
          fi

      - name: Restaurar ferramentas da saída
        working-directory: ${{ env.GENERATED_ROOT }}
        run: dotnet tool restore

      - name: Restaurar dependências da saída
        working-directory: ${{ env.GENERATED_ROOT }}
        run: dotnet restore --locked-mode

      - name: Compilar saída
        working-directory: ${{ env.GENERATED_ROOT }}
        run: dotnet build --configuration Release --no-restore

      - name: Executar testes da saída
        working-directory: ${{ env.GENERATED_ROOT }}
        run: dotnet test --configuration Release --no-build

      - name: Desinstalar template
        if: always()
        run: dotnet new uninstall "$GITHUB_WORKSPACE" || true
