name: Initialize repository

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Library name, e.g. MyCompany.MyLibrary'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: initialize-repository-${{ github.repository }}
  cancel-in-progress: false

jobs:
  initialize:
    name: Generate canonical library repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Validate initialization push token
        env:
          INITIALIZE_REPOSITORY_TOKEN: ${{ secrets.INITIALIZE_REPOSITORY_TOKEN }}
        shell: bash
        run: |
          if [ -z "$INITIALIZE_REPOSITORY_TOKEN" ]; then
            echo "::error::Configure repository secret INITIALIZE_REPOSITORY_TOKEN before running this one-time initializer."
            echo "::error::For a fine-grained token, grant this repository Contents: write, Pull requests: write, and Workflows: write. For a classic PAT, grant repo and workflow scopes."
            exit 1
          fi

      - name: Generate repository from template engine
        env:
          INITIALIZE_REPOSITORY_REPOSITORY: ${{ github.repository }}
          INITIALIZE_REPOSITORY_REF_NAME: ${{ github.ref_name }}
          INITIALIZE_REPOSITORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PROJECT_NAME: ${{ inputs.project_name }}
        run: bash scripts/initialize-repository.sh "$PROJECT_NAME" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE"

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore dependencies in locked mode
        run: dotnet restore --locked-mode

      - name: Normalize generated formatting
        run: dotnet format --no-restore

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
        shell: bash
        run: |
          project="src/$PROJECT_NAME/$PROJECT_NAME.csproj"
          if [ ! -f "$project" ]; then
            echo "::error::Generated project not found: $project"
            exit 1
          fi

          dotnet pack "$project" \
            --configuration Release \
            --no-build \
            --output artifacts/packages

      - name: Verify package
        run: dotnet run --file scripts/verify-package.cs -- artifacts/packages --expected-version 1.0.0

      - name: Commit initialized repository
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add --all

          if git diff --cached --quiet; then
            echo "::error::Initialization produced no changes to commit."
            exit 1
          fi

          git commit -m "Initialize $PROJECT_NAME"

      - name: Push initialization branch
        id: push
        env:
          INITIALIZE_REPOSITORY_TOKEN: ${{ secrets.INITIALIZE_REPOSITORY_TOKEN }}
          PROJECT_NAME: ${{ inputs.project_name }}
        shell: bash
        run: |
          slug="$(printf '%s' "$PROJECT_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"

          if [ -z "$slug" ]; then
            echo "::error::Could not derive an initialization branch name from project_name."
            exit 1
          fi

          branch="initialize-repository/$slug"
          auth="$(printf 'x-access-token:%s' "$INITIALIZE_REPOSITORY_TOKEN" | base64 -w0)"

          if ! git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push --force-with-lease origin "HEAD:refs/heads/$branch"; then
            echo "::error::Could not push the initialization branch. Confirm INITIALIZE_REPOSITORY_TOKEN has write access to this repository and permission to update workflow files. The initializer uses a pull request so default-branch branch protection and rulesets remain enforced."
            exit 1
          fi

          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Create initialization pull request
        env:
          GH_TOKEN: ${{ secrets.INITIALIZE_REPOSITORY_TOKEN }}
          INITIALIZE_BRANCH: ${{ steps.push.outputs.branch }}
          PROJECT_NAME: ${{ inputs.project_name }}
        shell: bash
        run: |
          existing_pr="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$INITIALIZE_BRANCH" \
            --base "$GITHUB_REF_NAME" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "$existing_pr" ]; then
            echo "Initialization pull request #$existing_pr is already open."
            exit 0
          fi

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$GITHUB_REF_NAME" \
            --head "$INITIALIZE_BRANCH" \
            --title "Initialize $PROJECT_NAME" \
            --body "$(cat <<EOF
## Summary

Initializes this repository as \`$PROJECT_NAME\` using the canonical .NET library template engine.

Before opening this pull request, the initializer successfully completed formatting, restore, build, tests, package generation, and package verification.

## Merge guidance

Merge this pull request after repository CI is green. The initialization intentionally removes template-maintenance-only assets and the one-time initializer itself from the generated product repository.
EOF
)"
