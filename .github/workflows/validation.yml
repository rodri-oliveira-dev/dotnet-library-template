name: Validação

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Restore bloqueado, CPM, formatação, build e testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências em locked mode
        run: dotnet restore Template.Library.slnx --locked-mode

      - name: Verificar políticas compartilhadas de build
        shell: bash
        run: |
          project="src/Template.Library/Template.Library.csproj"

          get_property() {
            dotnet msbuild "$project" -nologo -getProperty:"$1" \
              | tr -d '\r' \
              | sed '/^[[:space:]]*$/d' \
              | tail -n 1
          }

          assert_equals() {
            property="$1"
            expected="$2"
            actual="$(get_property "$property")"

            if [ "$actual" != "$expected" ]; then
              echo "$property: esperado '$expected', obtido '$actual'."
              exit 1
            fi
          }

          assert_contains() {
            property="$1"
            expected="$2"
            actual="$(get_property "$property")"

            if [[ "$actual" != *"$expected"* ]]; then
              echo "$property deveria conter '$expected', obtido '$actual'."
              exit 1
            fi
          }

          assert_equals Nullable enable
          assert_equals ImplicitUsings enable
          assert_equals TreatWarningsAsErrors true
          assert_equals NuGetAudit true
          assert_equals NuGetAuditMode all
          assert_equals RestoreEnablePackagePruning true
          assert_equals RestorePackagesWithLockFile true
          assert_equals Deterministic true
          assert_equals ContinuousIntegrationBuild true
          assert_contains WarningsNotAsErrors NU1901
          assert_contains WarningsNotAsErrors NU1902
          assert_contains WarningsAsErrors NU1903
          assert_contains WarningsAsErrors NU1904

      - name: Verificar Central Package Management
        shell: bash
        run: |
          project="tests/Template.Library.Tests/Template.Library.Tests.csproj"
          enabled="$(dotnet msbuild "$project" -nologo -getProperty:ManagePackageVersionsCentrally | tr -d '\r' | sed '/^[[:space:]]*$/d' | tail -n 1)"

          if [ "$enabled" != "true" ]; then
            echo "ManagePackageVersionsCentrally deveria ser true, obtido '$enabled'."
            exit 1
          fi

          if grep -R -n -E '<PackageReference[^>]*Version=' --include='*.csproj' src tests; then
            echo "PackageReference com Version encontrado em projeto gerenciado por CPM."
            exit 1
          fi

          if grep -E -i 'Dapper|EntityFrameworkCore|SqlClient|Testcontainers|AspNetCore|OpenTelemetry|Serilog|BenchmarkDotNet' Directory.Packages.props; then
            echo "Dependência específica/proibida encontrada na baseline central."
            exit 1
          fi

      - name: Listar dependências
        run: dotnet list Template.Library.slnx package --include-transitive

      - name: Verificar formatação
        run: dotnet format Template.Library.slnx --verify-no-changes --no-restore

      - name: Compilar
        run: dotnet build Template.Library.slnx --configuration Release --no-restore

      - name: Executar testes com MTP
        run: dotnet test Template.Library.slnx --configuration Release --no-build

      - name: Validar cobertura com Coverlet MTP
        run: dotnet test Template.Library.slnx --configuration Release --no-build --coverlet --coverlet-output-format cobertura

      - name: Verificar line endings
        shell: bash
        run: |
          unexpected="$({ git ls-files --eol -- '*.cs' '*.csproj' '*.props' '*.targets' '*.sln' '*.slnx' '*.json' '*.xml' '*.yaml' '*.yml' '*.md' '.editorconfig' '.gitignore' '.gitattributes' '*.sh' '*.ps1'; } | grep -E 'w/(crlf|mixed)' || true)"
          if [ -n "$unexpected" ]; then
            echo "Arquivos que deveriam usar LF possuem line endings inesperados:"
            echo "$unexpected"
            exit 1
          fi

      - name: Verificar árvore de trabalho limpa
        shell: bash
        run: |
          status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$status" ]; then
            echo "Restore, build ou testes deixaram artefatos não ignorados:"
            echo "$status"
            exit 1
          fi
