name: SonarQube Cloud

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analisar com SonarQube Cloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || format('{0}_{1}', github.repository_owner, github.event.repository.name) }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || github.repository_owner }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}

    steps:
      - name: SonarQube Cloud desabilitado
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "SONAR_TOKEN não configurado; análise SonarQube Cloud ignorada."

      - name: Checkout
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar .NET 10
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Validar configuração Sonar
        if: ${{ env.SONAR_TOKEN != '' }}
        shell: bash
        run: |
          if [ -z "$SONAR_PROJECT_KEY" ]; then
            echo "SONAR_PROJECT_KEY não pôde ser resolvido. Configure a Repository Variable SONAR_PROJECT_KEY."
            exit 1
          fi

          if [ -z "$SONAR_ORGANIZATION" ]; then
            echo "SONAR_ORGANIZATION não pôde ser resolvida. Configure a Repository Variable SONAR_ORGANIZATION."
            exit 1
          fi

          if [ -z "$SONAR_HOST_URL" ]; then
            echo "SONAR_HOST_URL não pôde ser resolvida. Configure a Repository Variable SONAR_HOST_URL."
            exit 1
          fi

          echo "Sonar project key: $SONAR_PROJECT_KEY"
          echo "Sonar organization: $SONAR_ORGANIZATION"
          echo "Sonar host: $SONAR_HOST_URL"

      - name: Restaurar ferramentas locais
        if: ${{ env.SONAR_TOKEN != '' }}
        run: dotnet tool restore

      - name: Restaurar dependências em locked mode
        if: ${{ env.SONAR_TOKEN != '' }}
        run: dotnet restore Template.Library.slnx --locked-mode

      - name: Iniciar análise Sonar
        if: ${{ env.SONAR_TOKEN != '' }}
        shell: bash
        run: >-
          dotnet sonarscanner begin
          /k:"$SONAR_PROJECT_KEY"
          /o:"$SONAR_ORGANIZATION"
          /d:sonar.host.url="$SONAR_HOST_URL"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover*.xml"

      - name: Compilar para análise
        if: ${{ env.SONAR_TOKEN != '' }}
        run: dotnet build Template.Library.slnx --configuration Release --no-restore --no-incremental

      - name: Executar testes e coletar cobertura OpenCover
        if: ${{ env.SONAR_TOKEN != '' }}
        run: >-
          dotnet test Template.Library.slnx
          --configuration Release
          --no-build
          --coverlet
          --coverlet-output-format opencover

      - name: Finalizar e enviar análise
        if: ${{ env.SONAR_TOKEN != '' }}
        shell: bash
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Auditar issues Security abertas no main (temporário)
        if: ${{ env.SONAR_TOKEN != '' }}
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --user "$SONAR_TOKEN:" \
            --get "$SONAR_HOST_URL/api/issues/search" \
            --data-urlencode "componentKeys=$SONAR_PROJECT_KEY" \
            --data-urlencode 'branch=main' \
            --data-urlencode 'issueStatuses=OPEN,CONFIRMED' \
            --data-urlencode 'impactSoftwareQualities=SECURITY' \
            --data-urlencode 'ps=500' \
            > sonar-issues.raw.json

          echo '--- Sonar Security findings ---'
          jq -r '.issues[] | [.key, .rule, .component, (.line // 0), .severity, .status, .message] | @tsv' sonar-issues.raw.json
          echo "Total: $(jq -r '.total' sonar-issues.raw.json)"
